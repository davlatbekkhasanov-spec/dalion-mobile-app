[project]
name = "anonymousuzbot-platform"
version = "0.1.0"
description = "Production-ready anonymous Telegram chat platform"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "redis>=5.1.1",
  "pydantic-settings>=2.5.2",
  "python-json-logger>=2.0.7",
  "orjson>=3.10.7",
  "httpx>=0.27.2",
  "tenacity>=9.0.0",
  "cryptography>=43.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.5",
  "mypy>=1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.1.0", "wheel"]
build-backend = "setuptools.build_meta"
