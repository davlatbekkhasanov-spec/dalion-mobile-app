<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GlobusMarket · Kuryer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #050508;
      --ink: #101014;
      --surface: #121218;
      --gold: #ffcc00;
      --gold2: #e6a800;
      --line: rgba(255, 204, 0, 0.22);
      --txt: #f4f4f5;
      --muted: #9ca3af;
      --radius: 18px;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--txt);
      background: linear-gradient(165deg, #12121a 0%, var(--black) 42%, #08080c 100%);
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-top));
      background: rgba(10, 10, 10, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .bar strong { font-size: 15px; letter-spacing: 0.02em; color: var(--gold); }
    .bar small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .lang { display: flex; gap: 8px; }
    .lang button {
      border: 1px solid var(--line);
      background: var(--ink);
      color: var(--txt);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px max(100px, calc(88px + env(safe-area-inset-bottom))); }
    .driver-card {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 16px 16px 14px;
      background: linear-gradient(155deg, rgba(255, 204, 0, 0.1), rgba(18, 18, 24, 0.98));
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .driver-card h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.02em;
      line-height: 1.2;
      max-width: 100%;
      word-break: break-word;
    }
    .driver-card #whoPhone {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .route-active-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(255, 204, 0, 0.14);
      border: 1px solid rgba(255, 204, 0, 0.35);
      color: #fff3b8;
    }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .feed-section { margin-top: 4px; }
    .section-title,
    .feed-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 12px;
    }
    .route-drawer {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 14px 14px 12px;
      background: linear-gradient(180deg, rgba(22, 22, 30, 0.98), rgba(10, 10, 14, 0.99));
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .route-panel-title {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fde68a;
    }
    .route-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .route-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 204, 0, 0.12);
      background: rgba(8, 8, 12, 0.65);
      min-height: 48px;
    }
    .route-row-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--black);
    }
    .route-row-main { flex: 1; min-width: 0; }
    .route-row-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--txt);
      line-height: 1.4;
      word-break: break-word;
    }
    .route-row-link {
      display: block;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
      border: 1px solid var(--line);
      background: rgba(255, 204, 0, 0.08);
      color: #fff8dc;
      width: 100%;
      box-sizing: border-box;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: linear-gradient(165deg, rgba(26, 26, 32, 0.98), rgba(12, 12, 16, 0.99));
      margin-bottom: 10px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      content-visibility: auto;
      contain-intrinsic-size: auto 120px;
      contain: layout style paint;
    }
    .card:active { transform: scale(0.99); }
    .row1 {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px 10px;
      width: 100%;
    }
    .row1 b {
      font-size: 15px;
      flex: 1 1 auto;
      min-width: 0;
      word-break: break-word;
      line-height: 1.3;
    }
    .row1 .row1-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
      max-width: 100%;
    }
    .pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--gold);
      white-space: nowrap;
    }
    .addr { margin-top: 8px; font-size: 13px; color: #e5e5e5; line-height: 1.35; }
    .sum { margin-top: 8px; font-size: 14px; font-weight: 800; color: var(--gold); }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button.main, .btn-link {
      flex: 1;
      min-width: 120px;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 11px 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button.main {
      background: linear-gradient(100deg, var(--gold), var(--gold2));
      border: none;
      color: var(--black);
    }
    button.main:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-link {
      background: transparent;
      color: var(--txt);
      text-decoration: none;
      text-align: center;
    }
    .err { color: #ffb4c0; font-size: 14px; margin-top: 8px; }
    .gate { padding: 20px 16px; text-align: center; }
    .gate a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 12px;
      background: linear-gradient(100deg, var(--gold), var(--gold2));
      color: var(--black);
      font-weight: 800;
      text-decoration: none;
    }
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .sheet-backdrop.on { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      max-height: 88vh;
      background: #0e0e0e;
      border-radius: 22px 22px 0 0;
      border: 1px solid var(--line);
      border-bottom: none;
      transform: translateY(110%);
      transition: transform 0.28s ease;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.on { transform: translateY(0); }
    .sheet-head {
      padding: 10px 14px 6px;
      border-bottom: 1px solid var(--line);
    }
    .sheet-head .row1 { align-items: flex-start; }
    .grab {
      width: 44px;
      height: 5px;
      border-radius: 99px;
      background: #444;
      margin: 4px auto 10px;
    }
    .sheet-body { overflow: auto; padding: 12px 14px 18px; flex: 1; }
    #detailMap {
      height: 32vh;
      min-height: 180px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }
    #detailMap img { max-width: none; }
    .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
    .kpi div {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .kpi b { display: block; color: var(--gold); font-size: 15px; margin-top: 4px; }
    .sheet-actions {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 12px -14px 0;
      padding: 12px 14px calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(14, 14, 14, 0) 0%, #0e0e0e 28%);
      border-top: 1px solid var(--line);
    }
    .fab-logout {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 30;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--ink);
      color: var(--txt);
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .auth-wrap { padding-top: 8px; }
    .auth-card {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 18px 16px;
      background: linear-gradient(155deg, rgba(255, 204, 0, 0.08), rgba(18, 18, 24, 0.98));
      box-shadow: var(--shadow);
    }
    .auth-card h2 { margin: 0 0 6px; font-size: 20px; color: var(--gold); }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .auth-tabs button {
      flex: 1;
      border: 1px solid var(--line);
      background: var(--ink);
      color: var(--muted);
      border-radius: 12px;
      padding: 10px;
      font-weight: 800;
      cursor: pointer;
    }
    .auth-tabs button.on { color: var(--gold); border-color: rgba(255, 204, 0, 0.45); background: rgba(255, 204, 0, 0.1); }
    .auth-field { margin-top: 12px; }
    .auth-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
    .auth-field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--surface);
      color: var(--txt);
      font-size: 16px;
    }
    .auth-main {
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #1a1200;
    }
    .auth-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .auth-err { color: #fca5a5; font-size: 13px; margin-top: 10px; display: none; }
    .pending-banner {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 204, 0, 0.35);
      background: rgba(255, 204, 0, 0.1);
      color: #fde68a;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <strong id="brand">GlobusMarket</strong>
      <small id="brandSub">Kuryer</small>
    </div>
    <div class="lang">
      <button type="button" id="langUz">UZ</button>
      <button type="button" id="langRu">RU</button>
    </div>
  </div>

  <div id="auth" class="wrap auth-wrap" style="display:none;">
    <div class="auth-card">
      <h2 id="authTitle">Kuryer</h2>
      <p class="muted" id="authHint" style="margin:0;"></p>
      <div id="authViewLogin">
        <div class="auth-tabs">
          <button type="button" class="on" id="tabLogin" data-tab="login">Kirish</button>
          <button type="button" id="tabRegister" data-tab="register">Ro‘yxatdan o‘tish</button>
        </div>
        <div class="auth-field">
          <label for="loginPhone" id="lblLoginPhone">Telefon</label>
          <input id="loginPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998901234567" />
        </div>
        <div class="auth-field">
          <label for="loginPassword" id="lblLoginPassword">Parol</label>
          <input id="loginPassword" type="password" autocomplete="current-password" />
        </div>
        <button type="button" class="auth-main" id="loginBtn">Kirish</button>
        <button type="button" class="auth-link" id="smsLoginLink">SMS orqali kirish</button>
        <button type="button" class="auth-link" id="forgotLink">Parolni unutdingizmi?</button>
      </div>
      <div id="authViewRegister" style="display:none;">
        <div class="auth-field">
          <label for="regFullName" id="lblRegName">F.I.O.</label>
          <input id="regFullName" type="text" autocomplete="name" />
        </div>
        <div class="auth-field">
          <label for="regPhone" id="lblRegPhone">Telefon</label>
          <input id="regPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998901234567" />
        </div>
        <div class="auth-field">
          <label for="regPlate" id="lblRegPlate">Avtomobil davlat raqami</label>
          <input id="regPlate" type="text" autocomplete="off" placeholder="01 A 123 BC" />
        </div>
        <button type="button" class="auth-main" id="registerBtn">Ro‘yxatdan o‘tish</button>
        <button type="button" class="auth-link" id="backToLoginFromReg">Kirish</button>
      </div>
      <div id="authViewSms" style="display:none;">
        <p class="muted" id="smsPhoneDisplay"></p>
        <div class="auth-field">
          <label for="smsCode" id="lblSmsCode">SMS kod</label>
          <input id="smsCode" type="text" inputmode="numeric" maxlength="8" autocomplete="one-time-code" />
        </div>
        <button type="button" class="auth-main" id="smsVerifyBtn">Tasdiqlash</button>
        <button type="button" class="auth-link" id="smsResendBtn">Kodni qayta yuborish</button>
        <button type="button" class="auth-link" id="backFromSms">Orqaga</button>
      </div>
      <div id="authViewSetPassword" style="display:none;">
        <div class="auth-field">
          <label for="setPassword" id="lblSetPassword">Yangi parol</label>
          <input id="setPassword" type="password" autocomplete="new-password" />
        </div>
        <div class="auth-field">
          <label for="setPasswordConfirm" id="lblSetPasswordConfirm">Parolni takrorlang</label>
          <input id="setPasswordConfirm" type="password" autocomplete="new-password" />
        </div>
        <button type="button" class="auth-main" id="setPasswordBtn">Parolni saqlash</button>
      </div>
      <div id="authViewForgot" style="display:none;">
        <div class="auth-field">
          <label for="forgotPhone" id="lblForgotPhone">Telefon</label>
          <input id="forgotPhone" type="tel" inputmode="tel" />
        </div>
        <div class="auth-field" id="forgotCodeWrap" style="display:none;">
          <label for="forgotCode" id="lblForgotCode">SMS kod</label>
          <input id="forgotCode" type="text" inputmode="numeric" maxlength="8" />
        </div>
        <div class="auth-field" id="forgotPassWrap" style="display:none;">
          <label for="forgotPassword" id="lblForgotPassword">Yangi parol</label>
          <input id="forgotPassword" type="password" autocomplete="new-password" />
        </div>
        <div class="auth-field" id="forgotPassConfirmWrap" style="display:none;">
          <label for="forgotPasswordConfirm" id="lblForgotPasswordConfirm">Parolni takrorlang</label>
          <input id="forgotPasswordConfirm" type="password" autocomplete="new-password" />
        </div>
        <button type="button" class="auth-main" id="forgotActionBtn">SMS yuborish</button>
        <button type="button" class="auth-link" id="backFromForgot">Kirish</button>
      </div>
      <p class="auth-err" id="authErr"></p>
    </div>
    <p style="margin-top:16px;"><a href="/" id="gateShop" class="auth-link" style="text-decoration:none;">Bosh sahifa</a></p>
  </div>

  <div id="app" class="wrap" style="display:none;">
    <div class="pending-banner" id="pendingBanner" style="display:none;"></div>
    <header class="driver-card">
      <h1 id="whoName">—</h1>
      <p class="muted" id="whoPhone">—</p>
      <p class="muted" id="whoPlate" style="margin-top:4px;"></p>
      <p class="route-active-badge" id="routeActiveHint" style="display:none;"></p>
    </header>
    <section id="myRoutePanel" class="route-drawer" style="display:none;">
      <h2 class="route-panel-title" id="myRouteHeading">Mening marshrutim</h2>
      <p class="muted" id="myRouteEta" style="margin:0 0 8px;"></p>
      <div id="myRouteList" class="route-list"></div>
    </section>
    <section class="feed-section">
      <h2 class="section-title" id="feedTitle">Buyurtmalar</h2>
      <div id="feed"></div>
      <p class="muted" id="feedHint" style="margin-top:12px;"></p>
    </section>
  </div>

  <button type="button" class="fab-logout" id="logoutBtn" style="display:none;">Chiqish</button>

  <div id="backdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div class="grab"></div>
      <div class="row1">
        <b id="dTitle">#</b>
        <span class="row1-meta">
          <span class="pill" id="dRouteStop" style="display:none;"></span>
          <span class="pill" id="dStatus">—</span>
        </span>
      </div>
    </div>
    <div class="sheet-body">
      <div id="detailMap"></div>
      <div class="kpi">
        <div><span id="lblDist">Masofa</span><b id="dDist">—</b></div>
        <div><span id="lblEta">Taxminiy vaqt</span><b id="dEta">—</b></div>
      </div>
      <p class="muted" id="dAddr"></p>
      <p class="muted" id="dItems"></p>
      <div class="sheet-actions">
        <div class="actions">
          <button type="button" class="main" id="claimBtn">Qabul qilish</button>
          <a class="btn-link main" id="openCourierBtn" href="#" rel="noopener" style="display:none;">Kuryer sahifasi</a>
        </div>
      </div>
      <p class="err" id="sheetErr" style="display:none;"></p>
    </div>
  </div>

  <script>

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    function normPortalStatus(s) {
      const aliases = {
        new: 'created',
        sent_to_tsd: 'preparing',
        picking: 'preparing',
        picked: 'ready_for_courier',
        waiting_courier: 'ready_for_courier'
      };
      const r = String(s || '')
        .trim()
        .toLowerCase()
        .replace(/-/g, '_')
        .replace(/\s+/g, '_');
      return aliases[r] || r;
    }
    function phonesMatch(a, b) {
      const da = String(a || '').replace(/\D/g, '').slice(-9);
      const db = String(b || '').replace(/\D/g, '').slice(-9);
      if (da.length >= 9 && db.length >= 9 && da === db) return true;
      const na = String(a || '').trim();
      const nb = String(b || '').trim();
      return Boolean(na && nb && na === nb);
    }
    function statusLabel(st) {
      const m = {
        ready_for_courier: lang === 'ru' ? 'Курьер ожидается' : 'Kuryer kutilmoqda',
        courier_assigned: lang === 'ru' ? 'Назначен' : 'Biriktirildi',
        out_for_delivery: lang === 'ru' ? 'В пути' : 'Yo‘lda'
      };
      return m[st] || st;

    function isMine(o) {
      if (!profile || !o) return false;

    async function loadRouteHint() {
      const hintEl = document.getElementById('routeActiveHint');
      const panel = document.getElementById('myRoutePanel');
      const listEl = document.getElementById('myRouteList');
      const etaEl = document.getElementById('myRouteEta');
      const headEl = document.getElementById('myRouteHeading');
      if (!profile) return;
      if (headEl) headEl.textContent = tr('myRouteTitle');
      try {
        const d = await api('/courier-portal/my-route');
        const routeOrders = Array.isArray(d.orders) ? d.orders : [];
        const routeFp = routeOrders
          .map((o) => `${o.id}:${o.courierStopSeq}:${o.status}:${o.updated_at || ''}`)
          .join('|');
        if (routeFp === lastRouteFingerprint && document.getElementById('myRouteList')?.innerHTML) return;
        lastRouteFingerprint = routeFp;
        const n = routeOrders.length;
        const eta = Number(d.routeEtaHintMinutes) || 0;
        if (hintEl) {
          if (n > 0) {
            hintEl.style.display = 'block';
            hintEl.textContent = `${tr('activeStops')}: ${n}`;
          } else {
            hintEl.style.display = 'none';
          }
        }
        if (panel && listEl && etaEl) {
          if (n > 0) {
            panel.style.display = 'block';
            etaEl.textContent = `${tr('myRouteEta')}: ~${eta} ${tr('min')}`;
            const sorted = [...routeOrders].sort(
              (a, b) => (Number(a.courierStopSeq) || 0) - (Number(b.courierStopSeq) || 0)
            );
            listEl.innerHTML = sorted
              .map((o) => {
                const addr =
                  [o.addressText, o.customerAddress, o.location].map((x) => String(x || '').trim()).find(Boolean) ||
                  '—';
                const ct = String(o.courierToken || '').trim();
                const href = ct ? `${location.origin}/courier/${encodeURIComponent(ct)}` : '#';
                const link = ct
                  ? `<a class="route-row-link" href="${esc(href)}" target="_blank" rel="noopener">${esc(tr('openCourierShort'))} #${esc(
                      o.orderNumber || ''

                  : '';
                return `<div class="route-row"><span class="route-row-num">${esc(String(o.courierStopSeq || '?'))}</span><div class="route-row-main"><div class="route-row-title">#${esc(
                  o.orderNumber || o.id
                )} · ${esc(addr)}</div>${link}</div></div>`;
              })
              .join('');
          } else {
            panel.style.display = 'none';
            listEl.innerHTML = '';
          }
        }
      } catch (_) {
        if (hintEl) hintEl.style.display = 'none';
        if (panel) panel.style.display = 'none';
      }
    }

    function renderFeed() {
      const el = document.getElementById('feed');
      if (!el) return;
      if (!orders.length) {
        el.innerHTML = `<p class="muted">${esc(tr('emptyFeed'))}</p>`;
        return;
      }
      const sorted = [...orders].sort((a, b) => {
        const ma = isMine(a);
        const mb = isMine(b);
        if (ma && !mb) return -1;
        if (!ma && mb) return 1;
        if (ma && mb) {
          const sa = Number(a.courierStopSeq);
          const sb = Number(b.courierStopSeq);
          if (Number.isFinite(sa) && Number.isFinite(sb) && sa !== sb) return sa - sb;
          if (Number.isFinite(sa) && !Number.isFinite(sb)) return -1;
          if (!Number.isFinite(sa) && Number.isFinite(sb)) return 1;
        }
        return String(b.updated_at || '').localeCompare(String(a.updated_at || ''));
      });
      el.innerHTML = sorted
        .map((o) => {
          const addr = [o.addressText, o.customerAddress, o.location].map((x) => String(x || '').trim()).find(Boolean) || '—';
          const mine = isMine(o);

    function ensureYmapsReady() {
      if (window.__yandexMapsFailed) return Promise.reject(new Error('yandex'));

      if (!ymapsReadyPromise) {

            clearTimeout(t);

      return ymapsReadyPromise;

    function hasCoord(lat, lng) {
      const la = Number(lat);
      const ln = Number(lng);
      if (!Number.isFinite(la) || !Number.isFinite(ln)) return false;
      if (Math.abs(la) > 90 || Math.abs(ln) > 180) return false;
      return !(la === 0 && ln === 0);
    }

    function drawRoute(o) {
      const errEl = document.getElementById('sheetErr');
      errEl.style.display = 'none';
      const box = document.getElementById('detailMap');
      const endLat = Number(o.locationLat);
      const endLng = Number(o.locationLng);
      const coordKey = `${o.id}:${endLat},${endLng}`;
      if (mapOrderId === o.id && mapCoordsKey === coordKey && yMap) return;
      mapOrderId = o.id;
      mapCoordsKey = coordKey;
      if (yMap) {
        try {
          yMap.destroy();
        } catch (_) {}
        yMap = yRoute = yStart = yEnd = null;
      }
      if (box) box.innerHTML = '';

      ensureYmaps()
        .then((ymaps) => {
          if (!box) return;
          const startLat = STORE.lat;
          const startLng = STORE.lng;
          if (!hasCoord(endLat, endLng)) {
            document.getElementById('dDist').textContent = '—';
            document.getElementById('dEta').textContent = '—';
            box.innerHTML = `<div class="muted" style="padding:16px;">${lang === 'ru' ? 'Нет координат для маршрута' : 'Marshrut uchun koordinata yo‘q'}</div>`;
            return;
          }

          yMap = new ymaps.Map(box, { center: [endLat, endLng], zoom: 12, controls: ['zoomControl'] }, { suppressMapOpenBlock: true });

          yStart = new ymaps.Placemark([startLat, startLng], { balloonContent: 'GlobusMarket' }, { preset: 'islands#blueCircleDotIcon' });
          yMap.geoObjects.add(yStart);

          yEnd = new ymaps.Placemark([endLat, endLng], { balloonContent: 'Manzil' }, { preset: 'islands#greenDotIcon' });
          yMap.geoObjects.add(yEnd);

          yRoute = new ymaps.multiRouter.MultiRoute(
            {
              referencePoints: [[startLat, startLng], [endLat, endLng]],
              params: { routingMode: 'auto' }
            },
            {
              boundsAutoApply: true,
              routeActiveStrokeWidth: 6,
              routeActiveStrokeColor: '#FFD60A',
              routeStrokeWidth: 0
            }
          );
          yRoute.model.events.add('requestsuccess', () => {
            const ar = yRoute.getActiveRoute();
            if (!ar) return;
            let distM = 0;
            let durS = 0;
            try {
              const d0 = ar.properties.get('distance');
              const t0 = ar.properties.get('duration');
              distM = typeof d0 === 'object' && d0 && typeof d0.value === 'number' ? d0.value : Number(d0) || 0;
              durS = typeof t0 === 'object' && t0 && typeof t0.value === 'number' ? t0.value : Number(t0) || 0;
            } catch (_) {}
            const km = (distM / 1000).toFixed(1);
            const mins = Math.max(1, Math.round(durS / 60));
            document.getElementById('dDist').textContent = `${km} ${tr('km')}`;
            document.getElementById('dEta').textContent = `${mins} ${tr('min')}`;
          });
          yMap.geoObjects.add(yRoute);
        })
        .catch(() => {
          errEl.textContent = lang === 'ru' ? 'Карта недоступна' : 'Xarita yuklanmadi';
          errEl.style.display = 'block';
        });
    }

    function openSheet(o, opts = {}) {

      document.getElementById('dItems').textContent =
        items.length > 0
          ? items.map((it) => `${it.title || it.name || '—'} × ${it.qty || it.quantity || 1}`).join(' · ')
          : '';
      patchSheetMeta(o);
      if (!sameOrder || opts.redrawMap) {
        document.getElementById('dDist').textContent = '…';
        document.getElementById('dEta').textContent = '…';
      }
      document.getElementById('backdrop').classList.add('on');
      document.getElementById('sheet').classList.add('on');
      if (!sameOrder || opts.redrawMap) {
        requestAnimationFrame(() => drawRoute(o));
      }
    }

    async function loadFeed(opts = {}) {
      const silent = opts.silent === true;
      if (feedInFlight) return;
      feedInFlight = true;
      const el = document.getElementById('feed');
      try {
        if (!silent && el) el.innerHTML = `<p class="muted">${esc(tr('loading'))}</p>`;
        const data = await api('/courier-portal/feed');
        const next = Array.isArray(data.orders) ? data.orders : [];
        const fp = feedFingerprint(next);
        const sheetOpen = document.getElementById('sheet')?.classList.contains('on');
        if (fp !== lastFeedFingerprint) {
          orders = next;
          lastFeedFingerprint = fp;
          renderFeed();
        } else {
          orders = next;
        }
        if (selected) {
          const fresh = orders.find((x) => String(x.id) === String(selected.id));
          if (fresh) {
            if (sheetOpen) openSheet(fresh, { redrawMap: false });
            else selected = fresh;
          }
        }
        routePollSkip += 1;
        if (routePollSkip % 3 === 0) void loadRouteHint();
      } finally {
        feedInFlight = false;
      }
    }

    async function boot() {
      applyLang();
      token = readToken();
      if (!token) {
        showAuthView('login');
        return;
      }
      try {
        const res = await fetch('/api/v1/courier-portal/session?token=' + encodeURIComponent(token), {
          cache: 'no-store'
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok || !data.application) {
          localStorage.removeItem(LS);
          token = '';
          showAuthView('login');
          return;
        }
        profile = data.application;
        if (data.needsPassword) {
          showAuthView('setPassword');
          return;
        }
        await openMainApp(profile);
      } catch (_) {
        showAuthView('login');
      }
    }

    document.getElementById('backdrop').onclick = closeSheet;
    document.getElementById('claimBtn').onclick = async () => {
      if (!selected) return;
      if (sheetPrimaryAction === 'start') {
        const ct = String(selected.courierToken || '').trim();
        if (ct) location.href = `${location.origin}/courier/${encodeURIComponent(ct)}`;
        return;
      }
      if (sheetPrimaryAction !== 'claim') return;
      const btn = document.getElementById('claimBtn');
      const err = document.getElementById('sheetErr');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = tr('loading');
      try {
        await api(`/courier-portal/orders/${encodeURIComponent(selected.id)}/claim`, { method: 'POST', body: '{}' });
        lastFeedFingerprint = '';
        await loadFeed({ silent: true });
        const fresh = orders.find((x) => String(x.id) === String(selected.id));
        if (fresh) openSheet(fresh, { redrawMap: true });
        else closeSheet();
      } catch (e) {
        err.textContent = e.message || tr('busy');
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = tr('claim');
      }
    };

    document.getElementById('openCourierBtn').onclick = (e) => {
      const href = document.getElementById('openCourierBtn').getAttribute('href');
      if (!href || href === '#') {
        e.preventDefault();
        return;
      }
      e.preventDefault();
      location.href = href;
    };

    document.getElementById('logoutBtn').onclick = () => {
      localStorage.removeItem(LS);
      token = '';
      profile = null;
      clearTimeout(pollTimer);
      showAuthView('login');
    };

    document.getElementById('tabLogin').onclick = () => {
      document.getElementById('tabLogin').classList.add('on');
      document.getElementById('tabRegister').classList.remove('on');
      document.getElementById('authViewLogin').style.display = 'block';
      document.getElementById('authViewRegister').style.display = 'none';
    };
    document.getElementById('tabRegister').onclick = () => {
      document.getElementById('tabRegister').classList.add('on');
      document.getElementById('tabLogin').classList.remove('on');
      document.getElementById('authViewLogin').style.display = 'none';
      document.getElementById('authViewRegister').style.display = 'block';
    };
    document.getElementById('backToLoginFromReg').onclick = () => document.getElementById('tabLogin').click();
    document.getElementById('backFromSms').onclick = () => document.getElementById('tabLogin').click();
    document.getElementById('backFromForgot').onclick = () => {
      forgotStep = 'phone';
      document.getElementById('forgotCodeWrap').style.display = 'none';
      document.getElementById('forgotPassWrap').style.display = 'none';
      document.getElementById('forgotPassConfirmWrap').style.display = 'none';
      document.getElementById('tabLogin').click();
    };

    document.getElementById('loginBtn').onclick = async () => {
      showAuthErr('');
      try {
        const data = await authJson('/courier-auth/login', {
          phone: document.getElementById('loginPhone').value,
          password: document.getElementById('loginPassword').value
        });
        await enterPortalFromAuth(data);
      } catch (e) {
        if (e.payload && e.payload.needsSmsLogin) {
          authSmsPhone = document.getElementById('loginPhone').value;
          showAuthView('sms');
          document.getElementById('smsPhoneDisplay').textContent = authSmsPhone;
          try {
            await authJson('/courier-auth/sms/send', { phone: authSmsPhone });
          } catch (err) {
            showAuthErr(err.message);
          }
          return;
        }
        showAuthErr(e.message);
      }
    };

    document.getElementById('smsLoginLink').onclick = async () => {
      authSmsPhone = document.getElementById('loginPhone').value.trim();
      if (!authSmsPhone) {
        showAuthErr(tr('phone'));
        return;
      }
      showAuthView('sms');
      document.getElementById('smsPhoneDisplay').textContent = authSmsPhone;
      try {
        await authJson('/courier-auth/sms/send', { phone: authSmsPhone });
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.getElementById('smsResendBtn').onclick = async () => {
      try {
        await authJson('/courier-auth/sms/send', { phone: authSmsPhone });
        showAuthErr('');
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.getElementById('smsVerifyBtn').onclick = async () => {
      try {
        const data = await authJson('/courier-auth/sms/verify', {
          phone: authSmsPhone,
          code: document.getElementById('smsCode').value
        });
        await enterPortalFromAuth(data);
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.getElementById('registerBtn').onclick = async () => {
      try {
        await authJson('/courier-auth/register', {
          phone: document.getElementById('regPhone').value,
          fullName: document.getElementById('regFullName').value,
          vehiclePlate: document.getElementById('regPlate').value
        });
        authSmsPhone = document.getElementById('regPhone').value;
        await authJson('/courier-auth/sms/send', { phone: authSmsPhone });
        showAuthView('sms');
        document.getElementById('smsPhoneDisplay').textContent = authSmsPhone;
        showAuthErr('');
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.getElementById('setPasswordBtn').onclick = async () => {
      try {
        const data = await authJson(
          '/courier-auth/password/set',
          {
            password: document.getElementById('setPassword').value,
            confirm: document.getElementById('setPasswordConfirm').value
          },
          true
        );
        await enterPortalFromAuth(data);
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.getElementById('forgotLink').onclick = () => {
      forgotStep = 'phone';
      document.getElementById('forgotCodeWrap').style.display = 'none';
      document.getElementById('forgotPassWrap').style.display = 'none';
      document.getElementById('forgotPassConfirmWrap').style.display = 'none';
      showAuthView('forgot');
    };

    document.getElementById('forgotActionBtn').onclick = async () => {
      const phone = document.getElementById('forgotPhone').value.trim();
      if (forgotStep === 'phone') {
        try {
          await authJson('/courier-auth/password/forgot/send', { phone });
          authSmsPhone = phone;
          forgotStep = 'code';
          document.getElementById('forgotCodeWrap').style.display = 'block';
          document.getElementById('forgotPassWrap').style.display = 'block';
          document.getElementById('forgotPassConfirmWrap').style.display = 'block';
          applyLang();
          showAuthErr('');
        } catch (e) {
          showAuthErr(e.message);
        }
        return;
      }
      try {
        const data = await authJson('/courier-auth/password/forgot/reset', {
          phone: authSmsPhone || phone,
          code: document.getElementById('forgotCode').value,
          password: document.getElementById('forgotPassword').value,
          confirm: document.getElementById('forgotPasswordConfirm').value
        });
        forgotStep = 'phone';
        await enterPortalFromAuth(data);
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) void loadFeed({ silent: true });
      schedulePoll();
    });
    document.getElementById('langUz').onclick = () => {
      lang = 'uz';
      localStorage.setItem(langKey, lang);
      applyLang();
    };
    document.getElementById('langRu').onclick = () => {
      lang = 'ru';
      localStorage.setItem(langKey, lang);
      applyLang();
    };

    boot();
  </script>
</body>
</html>
