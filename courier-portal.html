<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GlobusMarket · Kuryer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #050508;
      --ink: #101014;
      --surface: #121218;
      --gold: #ffcc00;
      --gold2: #e6a800;
      --line: rgba(255, 204, 0, 0.22);
      --txt: #f4f4f5;
      --muted: #9ca3af;
      --radius: 18px;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--txt);
      background: linear-gradient(165deg, #12121a 0%, var(--black) 42%, #08080c 100%);
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px calc(12px + env(safe-area-inset-top));
      background: rgba(10, 10, 10, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .bar strong { font-size: 15px; letter-spacing: 0.02em; color: var(--gold); }
    .bar small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .lang { display: flex; gap: 8px; }
    .lang button {
      border: 1px solid var(--line);
      background: var(--ink);
      color: var(--txt);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .bar-tools { display: flex; align-items: center; gap: 8px; }
    #soundToggle {
      border: 1px solid var(--line);
      background: var(--ink);
      color: var(--gold);
      border-radius: 10px;
      padding: 8px 11px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    #soundToggle.off { color: var(--muted); opacity: 0.65; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px max(100px, calc(88px + env(safe-area-inset-bottom))); }
    .driver-card {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 16px 16px 14px;
      background: linear-gradient(155deg, rgba(255, 204, 0, 0.1), rgba(18, 18, 24, 0.98));
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .driver-card h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.02em;
      line-height: 1.2;
      max-width: 100%;
      word-break: break-word;
    }
    .driver-card #whoPhone {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .route-active-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(255, 204, 0, 0.14);
      border: 1px solid rgba(255, 204, 0, 0.35);
      color: #fff3b8;
    }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .feed-section { margin-top: 4px; }
    .section-title,
    .feed-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 12px;
    }
    .route-drawer {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 14px 14px 12px;
      background: linear-gradient(180deg, rgba(22, 22, 30, 0.98), rgba(10, 10, 14, 0.99));
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .route-panel-title {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fde68a;
    }
    .route-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .route-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 204, 0, 0.12);
      background: rgba(8, 8, 12, 0.65);
      min-height: 48px;
    }
    .route-row-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--black);
    }
    .route-row-main { flex: 1; min-width: 0; }
    .route-row-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--txt);
      line-height: 1.4;
      word-break: break-word;
    }
    .route-row-link {
      display: block;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
      border: 1px solid var(--line);
      background: rgba(255, 204, 0, 0.08);
      color: #fff8dc;
      width: 100%;
      box-sizing: border-box;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: linear-gradient(165deg, rgba(26, 26, 32, 0.98), rgba(12, 12, 16, 0.99));
      margin-bottom: 10px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      content-visibility: auto;
      contain-intrinsic-size: auto 120px;
      contain: layout style paint;
    }
    .card:active { transform: scale(0.99); }
    .row1 {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px 10px;
      width: 100%;
    }
    .row1 b {
      font-size: 15px;
      flex: 1 1 auto;
      min-width: 0;
      word-break: break-word;
      line-height: 1.3;
    }
    .row1 .row1-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
      max-width: 100%;
    }
    .pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--gold);
      white-space: nowrap;
    }
    .addr { margin-top: 8px; font-size: 13px; color: #e5e5e5; line-height: 1.35; }
    .sum { margin-top: 8px; font-size: 14px; font-weight: 800; color: var(--gold); }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button.main, .btn-link {
      flex: 1;
      min-width: 120px;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 11px 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button.main {
      background: linear-gradient(100deg, var(--gold), var(--gold2));
      border: none;
      color: var(--black);
    }
    button.main:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-link {
      background: transparent;
      color: var(--txt);
      text-decoration: none;
      text-align: center;
    }
    .err { color: #ffb4c0; font-size: 14px; margin-top: 8px; }
    .gate { padding: 20px 16px; text-align: center; }
    .gate a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 12px;
      background: linear-gradient(100deg, var(--gold), var(--gold2));
      color: var(--black);
      font-weight: 800;
      text-decoration: none;
    }
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .sheet-backdrop.on { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      max-height: 88vh;
      background: #0e0e0e;
      border-radius: 22px 22px 0 0;
      border: 1px solid var(--line);
      border-bottom: none;
      transform: translateY(110%);
      transition: transform 0.28s ease;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.on { transform: translateY(0); }
    .sheet-head {
      padding: 10px 14px 6px;
      border-bottom: 1px solid var(--line);
    }
    .sheet-head .row1 { align-items: flex-start; }
    .grab {
      width: 44px;
      height: 5px;
      border-radius: 99px;
      background: #444;
      margin: 4px auto 10px;
    }
    .sheet-body { overflow: auto; padding: 12px 14px 18px; flex: 1; }
    #detailMap {
      height: 32vh;
      min-height: 180px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }
    #detailMap img { max-width: none; }
    .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
    .kpi div {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .kpi b { display: block; color: var(--gold); font-size: 15px; margin-top: 4px; }
    .sheet-actions {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 12px -14px 0;
      padding: 12px 14px calc(8px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(14, 14, 14, 0) 0%, #0e0e0e 28%);
      border-top: 1px solid var(--line);
    }
    .fab-logout {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 30;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--ink);
      color: var(--txt);
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
    }
    body.mode-auth {
      background:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255, 204, 0, 0.12), transparent 55%),
        linear-gradient(165deg, #14141c 0%, var(--black) 50%, #060608 100%);
    }
    body.mode-auth .bar {
      border-bottom-color: rgba(255, 255, 255, 0.06);
      background: rgba(8, 8, 10, 0.82);
    }
    .lang button.on {
      color: var(--black);
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border-color: transparent;
    }
    .auth-wrap {
      padding: 20px 16px 28px;
      min-height: calc(100dvh - 64px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 420px;
    }
    .auth-hero {
      text-align: center;
      margin-bottom: 18px;
    }
    .auth-hero-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: linear-gradient(145deg, rgba(255, 204, 0, 0.22), rgba(255, 204, 0, 0.06));
      border: 1px solid rgba(255, 204, 0, 0.35);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }
    .auth-hero h2 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--txt);
    }
    .auth-hero p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45; }
    .auth-card {
      border-radius: 22px;
      border: 1px solid rgba(255, 204, 0, 0.18);
      padding: 20px 18px 18px;
      background: linear-gradient(180deg, rgba(24, 24, 32, 0.95), rgba(10, 10, 14, 0.98));
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .auth-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 18px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .auth-tabs button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 11px;
      padding: 11px 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .auth-tabs button.on {
      color: var(--black);
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      box-shadow: 0 4px 14px rgba(255, 204, 0, 0.25);
    }
    .auth-field { margin-top: 14px; }
    .auth-field label {
      display: block;
      font-size: 11px;
      color: #a8b0bd;
      margin-bottom: 7px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .auth-field input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 15px;
      background: rgba(0, 0, 0, 0.35);
      color: var(--txt);
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-field input::placeholder { color: #6b7280; }
    .auth-field input:focus {
      outline: none;
      border-color: rgba(255, 204, 0, 0.55);
      box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.12);
    }
    .auth-main {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 14px;
      padding: 15px 16px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.02em;
      cursor: pointer;
      background: linear-gradient(135deg, var(--gold) 0%, #f5b800 48%, var(--gold2) 100%);
      color: #1a1200;
      box-shadow: 0 8px 24px rgba(255, 204, 0, 0.28);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .auth-main:active { transform: scale(0.98); }
    .auth-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .auth-link {
      display: block;
      width: 100%;
      text-align: center;
      color: #d4d4d8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 0;
      transition: color 0.15s;
    }
    .auth-link:hover { color: var(--gold); }
    .auth-link.accent { color: var(--gold); font-weight: 700; }
    .auth-err {
      color: #fecaca;
      font-size: 13px;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      display: none;
      line-height: 1.4;
    }
    .pending-banner {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 204, 0, 0.35);
      background: rgba(255, 204, 0, 0.1);
      color: #fde68a;
      font-size: 13px;
      line-height: 1.45;
    }
    body.mode-app { padding-bottom: 0; }
    body.mode-app .wrap { padding-bottom: calc(78px + env(safe-area-inset-bottom)); max-width: 560px; }
    .app-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255, 204, 0, 0.12), rgba(12, 12, 18, 0.95));
    }
    .app-top .who { min-width: 0; flex: 1; }
    .app-top .who b { display: block; font-size: 15px; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-top .who small { color: var(--muted); font-size: 12px; }
    .earn-chip {
      flex-shrink: 0;
      text-align: right;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 204, 0, 0.25);
    }
    .earn-chip span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
    .earn-chip strong { font-size: 15px; color: var(--gold); font-weight: 800; }
    .courier-panel { display: none; }
    .courier-panel.on { display: block; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-card {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 12px;
      background: rgba(0, 0, 0, 0.3);
    }
    .stat-card.wide { grid-column: 1 / -1; }
    .stat-card .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
    .stat-card .val { margin-top: 6px; font-size: 22px; font-weight: 800; color: var(--gold); line-height: 1.1; }
    .stat-card .sub { margin-top: 4px; font-size: 12px; color: #a1a1aa; }
    .period-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .period-chips button {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.35);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .period-chips button.on {
      color: var(--black);
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      border-color: transparent;
    }
    .earn-list { display: flex; flex-direction: column; gap: 8px; }
    .earn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.28);
    }
    .earn-row b { font-size: 14px; color: var(--txt); }
    .earn-row small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .earn-row .amt { font-size: 15px; font-weight: 800; color: #86efac; white-space: nowrap; }
    .rank-hero {
      text-align: center;
      padding: 20px 16px;
      border-radius: 20px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 204, 0, 0.28);
      background: linear-gradient(160deg, rgba(255, 204, 0, 0.15), rgba(8, 8, 12, 0.9));
    }
    .rank-hero .pos { font-size: 42px; font-weight: 900; color: var(--gold); line-height: 1; }
    .rank-hero .stars { margin-top: 8px; font-size: 18px; letter-spacing: 2px; color: #fde68a; }
    .lb-list { display: flex; flex-direction: column; gap: 8px; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.28);
    }
    .lb-row.me { border-color: rgba(255, 204, 0, 0.45); background: rgba(255, 204, 0, 0.08); }
    .lb-rank {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      flex-shrink: 0;
    }
    .lb-row:nth-child(1) .lb-rank { background: linear-gradient(135deg, #fde047, #ca8a04); color: #1a1200; }
    .lb-row:nth-child(2) .lb-rank { background: linear-gradient(135deg, #e5e7eb, #9ca3af); color: #1f2937; }
    .lb-row:nth-child(3) .lb-rank { background: linear-gradient(135deg, #fdba74, #c2410c); color: #1a1200; }
    .lb-main { flex: 1; min-width: 0; }
    .lb-main b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-main small { color: var(--muted); font-size: 11px; }
    .lb-meta { text-align: right; flex-shrink: 0; }
    .lb-meta .e { font-size: 13px; font-weight: 800; color: #86efac; }
    .lb-meta .d { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 900;
      color: #1a1200;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      box-shadow: 0 12px 28px rgba(255, 204, 0, 0.25);
    }
    .profile-head { text-align: center; margin-bottom: 18px; }
    .profile-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
    .profile-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .status-pill-app {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    function trFmt(key, vars) {
      let s = tr(key);
      if (vars) Object.keys(vars).forEach((k) => { s = s.replace(`{${k}}`, String(vars[k])); });
      return s;
    }
    function initials(name) {
      const p = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!p.length) return '?';
      return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
    }
    function starsText(avg) {
      const a = Number(avg) || 0;
      if (a < 0.1) return '☆☆☆☆☆';
      const full = Math.round(a);
      return '★'.repeat(Math.min(5, full)) + '☆'.repeat(Math.max(0, 5 - full));
    }
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function normPortalStatus(s) {
      const aliases = {
        new: 'created',
        sent_to_tsd: 'preparing',
        picking: 'preparing',
        picked: 'ready_for_courier',
        waiting_courier: 'ready_for_courier'
      };
      const r = String(s || '')
        .trim()
        .toLowerCase()
        .replace(/-/g, '_')
        .replace(/\s+/g, '_');
      return aliases[r] || r;
    }
    function phonesMatch(a, b) {

    function getAudioContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!webAudioCtx) webAudioCtx = new AC();
      return webAudioCtx;

    function unlockAudio() {

    function playNewOrderBeep() {
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        const t0 = ctx.currentTime;
        const g = ctx.createGain();
        g.gain.value = 2.2;
        g.connect(ctx.destination);
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 7000;
        lp.connect(g);
        function tone(start, freq, dur, peak) {
          const osc = ctx.createOscillator();
          const gn = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t0 + start);
          const a = t0 + start;
          const b = a + dur;
          gn.gain.setValueAtTime(0.0001, a);
          gn.gain.exponentialRampToValueAtTime(peak, a + 0.01);
          gn.gain.exponentialRampToValueAtTime(0.0001, b);
          osc.connect(gn);
          gn.connect(lp);
          osc.start(a);
          osc.stop(b + 0.02);
        }
        tone(0, 523, 0.12, 0.5);
        tone(0.08, 784, 0.35, 1);
        tone(0.18, 988, 0.28, 0.7);
      } catch (_) {}
    }
    function speakNewOrderVoice() {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(tr('voiceNewOrder'));
        u.lang = lang === 'ru' ? 'ru-RU' : 'uz-UZ';
        u.rate = 1.05;
        u.pitch = 1;

    async function loadRouteHint() {
      const hintEl = document.getElementById('routeActiveHint');
      const panel = document.getElementById('myRoutePanel');
      const listEl = document.getElementById('myRouteList');
      const etaEl = document.getElementById('myRouteEta');
      const headEl = document.getElementById('myRouteHeading');
      if (!profile) return;
      if (headEl) headEl.textContent = tr('myRouteTitle');
      try {
        const d = await api('/courier-portal/my-route');
        const routeOrders = Array.isArray(d.orders) ? d.orders : [];
        const routeFp = routeOrders
          .map((o) => `${o.id}:${o.courierStopSeq}:${o.status}:${o.updated_at || ''}`)
          .join('|');
        if (routeFp === lastRouteFingerprint && document.getElementById('myRouteList')?.innerHTML) return;
        lastRouteFingerprint = routeFp;
        const n = routeOrders.length;
        const eta = Number(d.routeEtaHintMinutes) || 0;
        if (hintEl) {
          if (n > 0) {
            hintEl.style.display = 'block';
            hintEl.textContent = `${tr('activeStops')}: ${n}`;
          } else {
            hintEl.style.display = 'none';
          }
        }
        if (panel && listEl && etaEl) {
          if (n > 0) {
            panel.style.display = 'block';
            etaEl.textContent = `${tr('myRouteEta')}: ~${eta} ${tr('min')}`;
            const sorted = [...routeOrders].sort(
              (a, b) => (Number(a.courierStopSeq) || 0) - (Number(b.courierStopSeq) || 0)
            );
            listEl.innerHTML = sorted
              .map((o) => {
                const addr =
                  [o.addressText, o.customerAddress, o.location].map((x) => String(x || '').trim()).find(Boolean) ||
                  '—';
                const ct = String(o.courierToken || '').trim();
                const href = ct ? `${location.origin}/courier/${encodeURIComponent(ct)}` : '#';
                const link = ct
                  ? `<a class="route-row-link" href="${esc(href)}">${esc(tr('openCourierShort'))} #${esc(
                      o.orderNumber || ''
                    )}</a>`
                  : '';
                return `<div class="route-row"><span class="route-row-num">${esc(String(o.courierStopSeq || '?'))}</span><div class="route-row-main"><div class="route-row-title">#${esc(
                  o.orderNumber || o.id
                )} · ${esc(addr)}</div>${link}</div></div>`;
              })
              .join('');
          } else {
            panel.style.display = 'none';
            listEl.innerHTML = '';
          }
        }
      } catch (_) {
        if (hintEl) hintEl.style.display = 'none';
        if (panel) panel.style.display = 'none';
      }
    }

        method: 'POST',

    /** Portalda biriktirilgach — alohida sahifada ism qayta so‘ralmasin: accept shu yerda. */
    async function portalCourierAccept(orderRow) {
      const o = orderRow;
      if (!o || !profile) return o;
      const ct = String(o.courierToken || '').trim();
      const st = normPortalStatus(o.status);
      if (!ct || st !== 'courier_assigned') return o;
      const name = String(profile.fullName || o.courierName || '').trim();
      const phone = String(profile.phone || o.courierPhone || '').trim();
      if (!name || !phone) return o;
      try {
        const res = await fetch(`/api/v1/courier/${encodeURIComponent(ct)}/accept`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ courierName: name, courierPhone: phone })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.order) {
          lastFeedFingerprint = '';
          return data.order;
        }
      } catch (_) {}
      return o;
    }

    function openCourierDeliveryPage(courierToken) {
      const ct = String(courierToken || '').trim();
      if (!ct) return;
      location.href = `${location.origin}/courier/${encodeURIComponent(ct)}?from=portal`;
    }

    async function api(path, opt) {
      const res = await fetch('/api/v1' + path, {
        headers: {
          'Content-Type': 'application/json',
          'X-Courier-Portal-Token': token
        },
        ...opt
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (data.needsPassword && document.body.classList.contains('mode-app')) {
          updateSetPasswordWho();
          showAuthView('setPassword');
        }
        const err = new Error(data.message || 'Error');
        err.payload = data;
        throw err;
      }
      return data;
    }

    function renderFeed() {
      const el = document.getElementById('feed');
      if (!el) return;
      if (!orders.length) {
        const st = String(profile?.status || '').toLowerCase();
        const msg = st === 'pending' ? tr('pendingFeed') : tr('emptyFeed');
        el.innerHTML = `<p class="muted">${esc(msg)}</p>`;
        return;
      }
      const sorted = [...orders].sort((a, b) => {
        const ma = isMine(a);
        const mb = isMine(b);
        if (ma && !mb) return -1;
        if (!ma && mb) return 1;
        if (ma && mb) {
          const sa = Number(a.courierStopSeq);
          const sb = Number(b.courierStopSeq);
          if (Number.isFinite(sa) && Number.isFinite(sb) && sa !== sb) return sa - sb;
          if (Number.isFinite(sa) && !Number.isFinite(sb)) return -1;
          if (!Number.isFinite(sa) && Number.isFinite(sb)) return 1;
        }
        return String(b.updated_at || '').localeCompare(String(a.updated_at || ''));
      });
      el.innerHTML = sorted
        .map((o) => {
          const addr = [o.addressText, o.customerAddress, o.location].map((x) => String(x || '').trim()).find(Boolean) || '—';
          const mine = isMine(o);
          const st = normPortalStatus(o.status);
          const stopPill =
            mine && o.courierStopSeq != null && Number(o.courierStopSeq) > 0
              ? `<span class="pill" title="${esc(tr('routePill'))}">${esc(String(o.courierStopSeq))}</span>`
              : '';
          return `
            <article class="card" data-id="${esc(o.id)}">
              <div class="row1">
                <b>#${esc(o.orderNumber || o.id)}</b>
                <span class="row1-meta">
                  ${stopPill}
                  <span class="pill">${esc(statusLabel(st))}</span>
                </span>
              </div>
              <div class="addr">${esc(addr)}</div>
              <div class="sum">${esc(money(o.total))}</div>
              ${mine ? `<div class="muted" style="margin-top:6px;font-size:12px;">✓ ${lang === 'ru' ? 'Ваш заказ' : 'Sizning buyurtmangiz'}</div>` : ''}
            </article>
          `;
        })
        .join('');
      el.querySelectorAll('.card').forEach((c) => {
        c.onclick = () => {
          const id = c.getAttribute('data-id');
          const o = orders.find((x) => String(x.id) === String(id));
          if (o) openSheet(o);
        };
      });
    }

    function closeSheet() {
      document.getElementById('backdrop').classList.remove('on');
      document.getElementById('sheet').classList.remove('on');
      selected = null;
      mapOrderId = null;
      mapCoordsKey = '';
    }

    function ensureYmaps() {
      if (window.__yandexMapsFailed) return Promise.reject(new Error('yandex'));
      return loadYandexScript().then(() => {
        if (!window.ymaps || typeof window.ymaps.ready !== 'function') return Promise.reject(new Error('yandex'));
        return ensureYmapsReady();
      });
    }

    function ensureYmapsReady() {
      if (window.__yandexMapsFailed) return Promise.reject(new Error('yandex'));
      if (!window.ymaps || typeof window.ymaps.ready !== 'function') return Promise.reject(new Error('yandex'));
      if (!ymapsReadyPromise) {
        ymapsReadyPromise = new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('timeout')), 9000);
          window.ymaps.ready(() => {
            clearTimeout(t);
            if (window.ymaps && window.ymaps.Map) resolve(window.ymaps);
            else reject(new Error('map'));
          });
        });
      }
      return ymapsReadyPromise;
    }

    function patchSheetMeta(o) {
      const st = normPortalStatus(o.status);
      document.getElementById('dStatus').textContent = statusLabel(st);
      const routeEl = document.getElementById('dRouteStop');
      if (isMine(o) && o.courierStopSeq != null && Number(o.courierStopSeq) > 0) {
        routeEl.textContent = `${tr('routePill')} ${o.courierStopSeq}`;
        routeEl.style.display = 'inline-block';
      } else {
        routeEl.textContent = '';
        routeEl.style.display = 'none';
      }
      const mine = isMine(o);
      const canClaim = st === 'ready_for_courier' && !String(o.courierPhone || '').trim();
      const ct = String(o.courierToken || '').trim();
      const canStart = mine && ct && (st === 'courier_assigned' || st === 'out_for_delivery');
      const claimBtn = document.getElementById('claimBtn');
      const openBtn = document.getElementById('openCourierBtn');
      const errEl = document.getElementById('sheetErr');
      sheetPrimaryAction = 'none';
      claimBtn.style.display = 'none';
      openBtn.style.display = 'none';
      openBtn.href = '#';
      claimBtn.disabled = false;
      errEl.style.display = 'none';
      errEl.textContent = '';
      if (canClaim) {
        sheetPrimaryAction = 'claim';
        claimBtn.style.display = 'block';
        claimBtn.textContent = tr('claim');
      } else if (canStart) {
        sheetPrimaryAction = 'start';
        const href = `${location.origin}/courier/${encodeURIComponent(ct)}`;
        claimBtn.style.display = 'block';
        claimBtn.textContent =
          st === 'out_for_delivery' ? tr('courierPageShort') : tr('startDelivery');
        openBtn.style.display = 'block';
        openBtn.href = href;
        openBtn.textContent = tr('courierPageShort');
      } else if (st === 'ready_for_courier' && String(o.courierPhone || '').trim() && !mine) {
        errEl.textContent = tr('busy');
        errEl.style.display = 'block';
      }
    }

    function hasCoord(lat, lng) {
      const la = Number(lat);
      const ln = Number(lng);
      if (!Number.isFinite(la) || !Number.isFinite(ln)) return false;
      if (Math.abs(la) > 90 || Math.abs(ln) > 180) return false;
      return !(la === 0 && ln === 0);
    }

    function drawRoute(o) {
      const errEl = document.getElementById('sheetErr');
      errEl.style.display = 'none';
      const box = document.getElementById('detailMap');
      const endLat = Number(o.locationLat);
      const endLng = Number(o.locationLng);
      const coordKey = `${o.id}:${endLat},${endLng}`;
      if (mapOrderId === o.id && mapCoordsKey === coordKey && yMap) return;
      mapOrderId = o.id;
      mapCoordsKey = coordKey;
      if (yMap) {
        try {
          yMap.destroy();
        } catch (_) {}
        yMap = yRoute = yStart = yEnd = null;
      }
      if (box) box.innerHTML = '';

      ensureYmaps()
        .then((ymaps) => {
          if (!box) return;
          const startLat = STORE.lat;
          const startLng = STORE.lng;
          if (!hasCoord(endLat, endLng)) {
            document.getElementById('dDist').textContent = '—';
            document.getElementById('dEta').textContent = '—';
            box.innerHTML = `<div class="muted" style="padding:16px;">${lang === 'ru' ? 'Нет координат для маршрута' : 'Marshrut uchun koordinata yo‘q'}</div>`;
            return;
          }

          yMap = new ymaps.Map(box, { center: [endLat, endLng], zoom: 12, controls: ['zoomControl'] }, { suppressMapOpenBlock: true });

          yStart = new ymaps.Placemark([startLat, startLng], { balloonContent: 'GlobusMarket' }, { preset: 'islands#blueCircleDotIcon' });
          yMap.geoObjects.add(yStart);

          yEnd = new ymaps.Placemark([endLat, endLng], { balloonContent: 'Manzil' }, { preset: 'islands#greenDotIcon' });
          yMap.geoObjects.add(yEnd);

          yRoute = new ymaps.multiRouter.MultiRoute(
            {
              referencePoints: [[startLat, startLng], [endLat, endLng]],
              params: { routingMode: 'auto' }
            },
            {
              boundsAutoApply: true,
              routeActiveStrokeWidth: 6,
              routeActiveStrokeColor: '#FFD60A',
              routeStrokeWidth: 0
            }
          );
          yRoute.model.events.add('requestsuccess', () => {
            const ar = yRoute.getActiveRoute();
            if (!ar) return;
            let distM = 0;
            let durS = 0;
            try {
              const d0 = ar.properties.get('distance');
              const t0 = ar.properties.get('duration');
              distM = typeof d0 === 'object' && d0 && typeof d0.value === 'number' ? d0.value : Number(d0) || 0;
              durS = typeof t0 === 'object' && t0 && typeof t0.value === 'number' ? t0.value : Number(t0) || 0;
            } catch (_) {}
            const km = (distM / 1000).toFixed(1);
            const mins = Math.max(1, Math.round(durS / 60));
            document.getElementById('dDist').textContent = `${km} ${tr('km')}`;
            document.getElementById('dEta').textContent = `${mins} ${tr('min')}`;
          });
          yMap.geoObjects.add(yRoute);
        })
        .catch(() => {
          errEl.textContent = lang === 'ru' ? 'Карта недоступна' : 'Xarita yuklanmadi';
          errEl.style.display = 'block';
        });
    }

    function openSheet(o, opts = {}) {
      const sameOrder = selected && String(selected.id) === String(o.id);
      selected = o;
      document.getElementById('dTitle').textContent = `#${o.orderNumber || o.id}`;
      const addr = [o.addressText, o.customerAddress, o.location].map((x) => String(x || '').trim()).find(Boolean) || '—';
      document.getElementById('dAddr').textContent = addr;
      const items = Array.isArray(o.items) ? o.items : [];
      document.getElementById('dItems').textContent =
        items.length > 0
          ? items.map((it) => `${it.title || it.name || '—'} × ${it.qty || it.quantity || 1}`).join(' · ')
          : '';
      patchSheetMeta(o);
      if (!sameOrder || opts.redrawMap) {
        document.getElementById('dDist').textContent = '…';
        document.getElementById('dEta').textContent = '…';
      }
      document.getElementById('backdrop').classList.add('on');
      document.getElementById('sheet').classList.add('on');
      if (!sameOrder || opts.redrawMap) {
        requestAnimationFrame(() => drawRoute(o));
      }
    }

    async function loadFeed(opts = {}) {
      const silent = opts.silent === true;
      if (feedInFlight) return;
      feedInFlight = true;
      const el = document.getElementById('feed');
      try {
        if (!silent && el) el.innerHTML = `<p class="muted">${esc(tr('loading'))}</p>`;
        const data = await api('/courier-portal/feed');
        const next = Array.isArray(data.orders) ? data.orders : [];
        if (data.pendingApproval) {
          orders = [];
          lastFeedFingerprint = '';
          lastClaimableIds = new Set();
          renderFeed();
          return;
        }
        const fp = feedFingerprint(next);
        const sheetOpen = document.getElementById('sheet')?.classList.contains('on');
        const prevClaimable = lastClaimableIds;
        if (fp !== lastFeedFingerprint) {
          const newCount = detectNewClaimableOrders(prevClaimable, next);
          orders = next;
          lastFeedFingerprint = fp;
          lastClaimableIds = claimableIdSet(next);
          renderFeed();
          if (newCount > 0) alertNewOrders(newCount);
        } else {
          orders = next;
          lastClaimableIds = claimableIdSet(next);
        }
        if (!feedAlertsReady) feedAlertsReady = true;
        if (selected) {
          const fresh = orders.find((x) => String(x.id) === String(selected.id));
          if (fresh) {
            if (sheetOpen) openSheet(fresh, { redrawMap: false });
            else selected = fresh;
          }
        }
        routePollSkip += 1;
        if (routePollSkip % 3 === 0) void loadRouteHint();
      } finally {
        feedInFlight = false;
      }
    }

    async function boot() {
      applyAuthLang();
      token = readToken();
      if (!token) {
        showAuthView('login');
        return;
      }
      try {
        const res = await fetch('/api/v1/courier-portal/session?token=' + encodeURIComponent(token), {
          cache: 'no-store'
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok || !data.application) {
          localStorage.removeItem(LS);
          token = '';
          showAuthView('login');
          return;
        }
        profile = data.application;
        if (data.needsPassword) {
          updateSetPasswordWho();
          showAuthView('setPassword');
          return;
        }
        await openMainApp(profile);
      } catch (_) {
        showAuthView('login');
      }
    }

    document.getElementById('backdrop').onclick = closeSheet;
    document.getElementById('claimBtn').onclick = async () => {
      if (!selected) return;
      const btn = document.getElementById('claimBtn');
      const err = document.getElementById('sheetErr');
      if (sheetPrimaryAction === 'start') {
        const ct = String(selected.courierToken || '').trim();
        if (!ct) return;
        err.style.display = 'none';
        btn.disabled = true;
        btn.textContent = tr('loading');
        try {
          let o = selected;
          if (normPortalStatus(o.status) === 'courier_assigned') {
            o = await portalCourierAccept(o);
            selected = o;
          }
          if (normPortalStatus(o.status) === 'out_for_delivery') {
            openCourierDeliveryPage(ct);
            return;
          }
          err.textContent = tr('acceptRequired');
          err.style.display = 'block';
        } finally {
          btn.disabled = false;
          if (selected) patchSheetMeta(selected);
        }
        return;
      }
      if (sheetPrimaryAction !== 'claim') return;
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = tr('loading');
      try {
        const claimData = await api(`/courier-portal/orders/${encodeURIComponent(selected.id)}/claim`, {
          method: 'POST',
          body: '{}'
        });
        lastFeedFingerprint = '';
        await loadFeed({ silent: true });
        void loadDashboard();
        let fresh = claimData.order || orders.find((x) => String(x.id) === String(selected.id));
        if (fresh) {
          fresh = await portalCourierAccept(fresh);
          selected = fresh;
          openSheet(fresh, { redrawMap: true });
        } else {
          closeSheet();
        }
      } catch (e) {
        err.textContent = e.message || tr('busy');
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        if (selected) patchSheetMeta(selected);
      }
    };

    document.getElementById('openCourierBtn').onclick = (e) => {
      e.preventDefault();
      const ct = String(selected?.courierToken || '').trim();
      if (!ct) return;
      openCourierDeliveryPage(ct);
    };

    function doLogout() {
      localStorage.removeItem(LS);
      token = '';
      profile = null;
      dashboard = null;
      document.body.classList.remove('mode-app');
      clearTimeout(pollTimer);
      showAuthView('login');
    }
    document.getElementById('logoutBtn')?.addEventListener('click', doLogout);

    document.querySelectorAll('.courier-nav button').forEach((btn) => {
      btn.addEventListener('click', () => switchPanel(btn.dataset.panel || 'orders'));
    });
    document.querySelectorAll('#periodChips button').forEach((btn) => {
      btn.addEventListener('click', () => {
        earnPeriod = btn.dataset.period || 'today';
        document.querySelectorAll('#periodChips button').forEach((b) => b.classList.toggle('on', b === btn));
        renderWalletPanel();
      });
    });
    document.getElementById('profileRefreshBtn')?.addEventListener('click', async () => {
      await loadDashboard();
      await loadFeed({ silent: true });
    });

    document.getElementById('tabLogin').onclick = () => showAuthView('login');
    document.getElementById('tabRegister').onclick = () => showAuthView('register');
    document.getElementById('backToLoginFromReg').onclick = () => showAuthView('login');
    document.getElementById('backFromSms').onclick = () => showAuthView('login');
    document.getElementById('backFromForgot').onclick = () => {
      forgotStep = 'phone';
      document.getElementById('forgotCodeWrap').style.display = 'none';
      document.getElementById('forgotPassWrap').style.display = 'none';
      document.getElementById('forgotPassConfirmWrap').style.display = 'none';
      showAuthView('login');
    };

    document.getElementById('loginBtn').onclick = async () => {
      showAuthErr('');
      try {
        const data = await authJson('/courier-auth/login', {
          phone: document.getElementById('loginPhone').value,
          password: document.getElementById('loginPassword').value
        });
        await enterPortalFromAuth(data);
      } catch (e) {
        if (e.payload && e.payload.needsSmsLogin) {
          authSmsPhone = document.getElementById('loginPhone').value;
          showAuthView('sms');
          document.getElementById('smsPhoneDisplay').textContent = authSmsPhone;
          try {
            await authJson('/courier-auth/sms/send', { phone: authSmsPhone });
          } catch (err) {
            showAuthErr(err.message);
          }
          return;
        }
        showAuthErr(e.message);
      }
    };

    document.getElementById('smsLoginLink').onclick = async () => {
      authSmsPhone = document.getElementById('loginPhone').value.trim();
      if (!authSmsPhone) {
        showAuthErr(tr('phone'));
        return;
      }
      showAuthView('sms');
      document.getElementById('smsPhoneDisplay').textContent = authSmsPhone;
      try {
        await authJson('/courier-auth/sms/send', { phone: authSmsPhone });
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.getElementById('smsResendBtn').onclick = async () => {
      try {
        await authJson('/courier-auth/sms/send', { phone: authSmsPhone });
        showAuthErr('');
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.getElementById('smsVerifyBtn').onclick = async () => {
      try {
        const data = await authJson('/courier-auth/sms/verify', {
          phone: authSmsPhone,
          code: document.getElementById('smsCode').value
        });
        await enterPortalFromAuth(data);
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    function goLoginWithPhone(phone, msg) {
      const p = String(phone || '').trim();
      if (p) {
        const lp = document.getElementById('loginPhone');
        if (lp) lp.value = p;
      }
      showAuthView('login');
      if (msg) showAuthErr(msg);
    }

    document.getElementById('registerBtn').onclick = async () => {
      const btn = document.getElementById('registerBtn');
      showAuthErr('');
      if (btn) btn.disabled = true;
      try {
        await authJson('/courier-auth/register', {
          phone: document.getElementById('regPhone').value,
          fullName: document.getElementById('regFullName').value,
          vehiclePlate: document.getElementById('regPlate').value
        });
        authSmsPhone = document.getElementById('regPhone').value.trim();
        await authJson('/courier-auth/sms/send', { phone: authSmsPhone });
        document.getElementById('smsCode').value = '';
        showAuthView('sms');
        document.getElementById('smsPhoneDisplay').textContent = authSmsPhone;
        showAuthErr('');
      } catch (e) {
        const code = e.payload && e.payload.code;
        if (code === 'phone_registered' || code === 'phone_use_login') {
          goLoginWithPhone(document.getElementById('regPhone').value, e.message);
          return;
        }
        showAuthErr(e.message);
      } finally {
        if (btn) btn.disabled = false;
      }
    };

    document.getElementById('setPasswordBtn').onclick = async () => {
      try {
        const data = await authJson(
          '/courier-auth/password/set',
          {
            password: document.getElementById('setPassword').value,
            confirm: document.getElementById('setPasswordConfirm').value
          },
          true
        );
        await enterPortalFromAuth(data);
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.getElementById('forgotLink').onclick = () => {
      forgotStep = 'phone';
      document.getElementById('forgotCodeWrap').style.display = 'none';
      document.getElementById('forgotPassWrap').style.display = 'none';
      document.getElementById('forgotPassConfirmWrap').style.display = 'none';
      showAuthView('forgot');
    };

    document.getElementById('forgotActionBtn').onclick = async () => {
      const phone = document.getElementById('forgotPhone').value.trim();
      if (forgotStep === 'phone') {
        try {
          await authJson('/courier-auth/password/forgot/send', { phone });
          authSmsPhone = phone;
          forgotStep = 'code';
          document.getElementById('forgotCodeWrap').style.display = 'block';
          document.getElementById('forgotPassWrap').style.display = 'block';
          document.getElementById('forgotPassConfirmWrap').style.display = 'block';
          const hintEl = document.getElementById('authHint');
          if (hintEl) hintEl.textContent = tr('authHintForgotCode');
          applyAuthLang();
          showAuthErr('');
        } catch (e) {
          showAuthErr(e.message);
        }
        return;
      }
      try {
        const data = await authJson('/courier-auth/password/forgot/reset', {
          phone: authSmsPhone || phone,
          code: document.getElementById('forgotCode').value,
          password: document.getElementById('forgotPassword').value,
          confirm: document.getElementById('forgotPasswordConfirm').value
        });
        forgotStep = 'phone';
        document.getElementById('forgotCodeWrap').style.display = 'none';
        document.getElementById('forgotPassWrap').style.display = 'none';
        document.getElementById('forgotPassConfirmWrap').style.display = 'none';
        await enterPortalFromAuth(data);
      } catch (e) {
        showAuthErr(e.message);
      }
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) void loadFeed({ silent: true });
      schedulePoll();
    });
    document.getElementById('langUz').onclick = () => {
      lang = 'uz';
      localStorage.setItem(langKey, lang);
      applyLang();
    };
    document.getElementById('langRu').onclick = () => {
      lang = 'ru';
      localStorage.setItem(langKey, lang);
      applyLang();
    };
    document.getElementById('soundToggle')?.addEventListener('click', () => {
      const next = !getSoundOn();
      setSoundOn(next);
      syncSoundToggle();
      unlockAudio();
      if (next) {
        playNewOrderBeep();
        speakNewOrderVoice();
      }
    });
    document.addEventListener(
      'click',
      () => unlockAudio(),
      { once: true, capture: true }
    );

    boot();
  </script>
</body>
